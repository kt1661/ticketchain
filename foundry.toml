[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

# Verbose enough to see fuzz runs and gas reports during development
fuzz = { runs = 256 }
invariant = { runs = 256, depth = 32, fail_on_revert = false }

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 1000, depth = 64 }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
